<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Password-recovery metadata/security and shared visual styles. -->
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' http://localhost:* http://127.0.0.1:*; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="theme-color" content="#172114"/>
  <meta name="description" content="Reset your UgoTour password."/>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="manifest" href="../manifest.webmanifest"/>
  <link rel="stylesheet" href="../css/main.css?v=9.0.0"/>
  <link rel="stylesheet" href="../css/components.css?v=9.0.0"/>
  <link rel="stylesheet" href="../css/responsive.css?v=9.0.0"/>
  <title>Forgot Password | UgoTour</title>
</head>
<body class="auth-visual-page">
  <main id="main-content" class="auth-entry-main">
    <section class="auth-entry auth-entry-compact">
      <!-- Branded recovery artwork. -->
      <div class="auth-photo-panel">
        <img src="../images/optimized/destinations/bwindi/bwindi-01.webp" alt="Mountain gorilla in Bwindi forest"/>
        <div class="auth-photo-shade"></div>
        <div class="auth-photo-copy"><p>UgoTour account</p><h1>Find your way back.</h1></div>
      </div>

      <!-- forgot-password.js submits this email and displays a neutral recovery result. -->
      <div class="auth-form-panel">
        <a class="auth-brand" href="../index.html">Ugo<span>Tour</span></a>
        <p class="section-kicker">Account recovery</p>
        <h2>Reset your password</h2>
        <p class="auth-form-copy">Enter the email attached to your UgoTour account.</p>
        <form id="forgot-form" class="starter-form auth-form">
          <label>Email<input id="forgot-email" type="email" autocomplete="email" required/></label>
          <button class="primary-button" type="submit">Send reset instructions</button>
          <p id="forgot-message" class="form-message" aria-live="polite"></p>
          <!-- Visible only in development when the backend returns a direct test reset URL. -->
          <p id="forgot-dev-link" class="dev-reset-link" hidden></p>
        </form>
        <p class="auth-switch-copy"><a href="./login.html">Back to login</a></p>
      </div>
    </section>
  </main>

  <!-- Recovery controller + shared footer bootstrap. -->
  <footer id="site-footer"></footer>
  <script type="module" src="../js/pages/forgot-password.js"></script>
  <script type="module" src="../js/footer-boot.js"></script>
</body>
</html>
