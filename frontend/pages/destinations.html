<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#172114" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <meta name="description" content="Browse Uganda destinations with UgoTour." />
  <title>Destinations | UgoTour</title>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="catalog-hero">
      <div>
        <p class="section-kicker">Choose your adventure</p>
        <h1 class="page-title">Find a place that feels like you.</h1>
        <p class="catalog-intro">Search Uganda by place, region or travel style. Every card opens a complete destination and booking experience.</p>
      </div>
      <div class="catalog-stat" aria-label="Destination count"><strong id="catalog-total">0</strong><span>places to explore</span></div>
    </section>

    <section class="section-shell catalog-section" aria-labelledby="catalog-heading">
      <div class="catalog-heading-row">
        <div><p class="section-kicker">Discover</p><h2 id="catalog-heading">Explore Uganda</h2></div>
        <button id="reset-filters" class="secondary-button" type="button">Reset filters</button>
      </div>

      <div class="catalog-controls">
        <label class="catalog-search" for="catalog-search-input">
          <span>Search destinations</span>
          <input id="catalog-search-input" type="search" placeholder="Search name, region or category…" autocomplete="off" />
        </label>
        <div id="category-filters" class="category-filters" aria-label="Filter destinations by category"></div>
      </div>

      <p id="destination-summary" class="catalog-summary" aria-live="polite"></p>
      <div id="destination-list" class="experience-grid destination-grid"></div>
      <div id="destination-empty-state" class="empty-state" hidden><h3>No destination found.</h3><p>Try another search or reset your filters.</p></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="../js/pages/destinations.js"></script>
</body>
</html>
