<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' http://localhost:* http://127.0.0.1:*; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="theme-color" content="#172114" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="Manage your UgoTour profile and profile picture." />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../css/main.css?v=9.0.0" />
  <link rel="stylesheet" href="../css/components.css?v=9.0.0" />
  <link rel="stylesheet" href="../css/animations.css?v=9.0.0" />
  <link rel="stylesheet" href="../css/responsive.css?v=9.0.0" />
  <title>Profile | UgoTour</title>
  <meta name="robots" content="noindex,nofollow" />
</head>
<body class="dashboard-page profile-page">
  <header id="site-header"></header>

  <main id="main-content" class="dashboard-main">
    <div id="profile-account-content" class="profile-dashboard">
      <section id="profile-logged-out" hidden></section>

      <section id="profile-logged-in">
        <header class="profile-identity-card">
          <div class="profile-banner" aria-hidden="true"></div>
          <div class="profile-identity-content">
            <div class="profile-photo-shell">
              <div id="profile-avatar" class="profile-avatar">UG</div>
              <button
                id="profile-photo-edit"
                class="profile-photo-edit"
                type="button"
                aria-label="Edit profile picture"
                aria-haspopup="dialog"
                aria-controls="profile-photo-dialog"
              >+</button>
            </div>

            <div class="profile-identity-copy">
              <p class="section-kicker">Your UgoTour account</p>
              <h1 id="profile-display-name">UgoTour User</h1>
              <p id="profile-display-email">user@example.com</p>
              <span>Member since <strong id="profile-member-since">—</strong></span>
            </div>

            <button id="profile-edit-shortcut" class="secondary-button" type="button">Edit profile</button>
          </div>
        </header>

        <div class="profile-dashboard-grid profile-dashboard-grid-simplified">
          <section id="profile-details-card" class="profile-settings-card profile-details-card">
            <div class="profile-card-heading">
              <div>
                <p class="section-kicker">Profile details</p>
                <h2>Name and email</h2>
              </div>
            </div>
            <form id="profile-form" class="starter-form profile-form profile-form-inline">
              <label>Full name<input id="profile-name" type="text" autocomplete="name" required /></label>
              <label>Email<input id="profile-email" type="email" autocomplete="email" required /></label>
              <button class="primary-button" type="submit">Save profile</button>
              <p id="profile-message" class="form-message" aria-live="polite"></p>
            </form>
          </section>

          <section class="profile-settings-card profile-security-card">
            <div class="profile-card-heading">
              <div>
                <p class="section-kicker">Security</p>
                <h2>Change password</h2>
              </div>
            </div>
            <form id="password-form" class="starter-form profile-form profile-form-password">
              <label>Current password<input id="current-password" type="password" autocomplete="current-password" required /></label>
              <label>New password<input id="new-password" type="password" minlength="10" autocomplete="new-password" required /></label>
              <label>Confirm new password<input id="confirm-new-password" type="password" minlength="10" autocomplete="new-password" required /></label>
              <button class="secondary-button" type="submit">Change password</button>
              <p id="password-message" class="form-message" aria-live="polite"></p>
            </form>
          </section>
        </div>

        <div class="profile-quick-actions" aria-label="Profile actions">
          <a class="secondary-button profile-saved-button" href="./saved.html">Saved places</a>
          <button id="profile-logout-button" class="secondary-button profile-logout-button" type="button">Logout</button>
        </div>
      </section>
    </div>

    <dialog id="profile-photo-dialog" class="profile-photo-dialog" aria-labelledby="profile-photo-dialog-title">
      <section class="profile-photo-editor">
        <header class="profile-photo-editor-header">
          <div>
            <p class="section-kicker">Profile picture</p>
            <h2 id="profile-photo-dialog-title">Edit your photo</h2>
          </div>
          <button id="profile-photo-dialog-close" class="profile-photo-dialog-close" type="button" aria-label="Close profile picture editor">×</button>
        </header>

        <div class="profile-photo-preview-wrap">
          <div id="profile-photo-preview" class="profile-photo-preview" aria-live="polite">UG</div>
          <span class="profile-photo-preview-label">Preview</span>
        </div>

        <p class="profile-photo-editor-copy">Choose a JPEG, PNG or WebP image up to 6 MB. Your photo is previewed here before anything is saved.</p>

        <input id="profile-photo-input" type="file" accept="image/jpeg,image/png,image/webp" hidden />

        <div class="profile-photo-editor-tools">
          <button id="profile-photo-choose" class="secondary-button" type="button">Choose / change photo</button>
          <button id="profile-photo-remove" class="secondary-button profile-photo-remove" type="button">Remove photo</button>
        </div>

        <p id="profile-photo-message" class="form-message profile-photo-editor-message" aria-live="polite"></p>

        <footer class="profile-photo-editor-footer">
          <button id="profile-photo-cancel" class="secondary-button" type="button">Cancel</button>
          <button id="profile-photo-save" class="primary-button" type="button" disabled>Save photo</button>
        </footer>
      </section>
    </dialog>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="../js/pages/profile.js"></script>
</body>
</html>
