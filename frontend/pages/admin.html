<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Admin metadata/security. noindex prevents this private dashboard being indexed. -->
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' http://localhost:* http://127.0.0.1:*; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="theme-color" content="#172114"/>
  <meta name="description" content="UgoTour admin content dashboard."/>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="../css/main.css?v=9.0.0"/>
  <link rel="stylesheet" href="../css/components.css?v=9.0.0"/>
  <link rel="stylesheet" href="../css/responsive.css?v=9.0.0"/>
  <title>Admin | UgoTour</title>
</head>
<body class="dashboard-page admin-page">
  <!-- Shared navbar. admin.js validates both authentication and the admin role. -->
  <header id="site-header"></header>

  <main id="main-content" class="dashboard-main">
    <section class="section-shell admin-shell">
      <!-- Dashboard heading, manual refresh control and server-provided summary metrics. -->
      <div class="page-content-titlebar">
        <div>
          <p class="section-kicker">Administration</p>
          <h1>UgoTour content</h1>
          <p class="section-lead">Maintain tourism records and review messages without editing SQL manually.</p>
        </div>
        <button id="admin-refresh" class="secondary-button" type="button">Refresh</button>
      </div>
      <div id="admin-summary" class="admin-summary-grid"></div>

      <!-- Tabs switch between destinations, attractions and Contact messages. -->
      <div class="admin-tabs" role="tablist">
        <button class="category-filter-button is-active" data-admin-tab="destinations">Destinations</button>
        <button class="category-filter-button" data-admin-tab="attractions">Attractions</button>
        <button class="category-filter-button" data-admin-tab="messages">Messages</button>
      </div>
      <div id="admin-status" class="form-message" aria-live="polite"></div>

      <!-- Destination management panel. Records are rendered dynamically by admin.js. -->
      <section id="admin-destinations-panel">
        <div class="admin-toolbar">
          <input id="admin-place-search" type="search" placeholder="Filter records…"/>
          <button id="admin-new-destination" class="primary-button" type="button">New destination</button>
        </div>
        <div id="admin-destinations-list" class="admin-record-list"></div>
      </section>

      <!-- Attraction management panel. -->
      <section id="admin-attractions-panel" hidden>
        <div class="admin-toolbar"><button id="admin-new-attraction" class="primary-button" type="button">New attraction</button></div>
        <div id="admin-attractions-list" class="admin-record-list"></div>
      </section>

      <!-- Contact-message moderation panel. -->
      <section id="admin-messages-panel" hidden><div id="admin-messages-list" class="admin-message-list"></div></section>
    </section>
  </main>

  <!-- Shared destination/attraction editor dialog. Hidden fields tell admin.js which
       record/type is being edited; the same form handles create and update actions. -->
  <dialog id="admin-editor" class="admin-editor">
    <form id="admin-editor-form" method="dialog" class="starter-form">
      <div class="admin-editor-heading">
        <div><p class="section-kicker" id="admin-editor-kicker">Edit</p><h2 id="admin-editor-title">Tourism record</h2></div>
        <button type="button" id="admin-editor-close" class="map-panel-close">×</button>
      </div>
      <input id="admin-editor-id" type="hidden"/>
      <input id="admin-editor-type" type="hidden"/>
      <label>Name<input id="admin-editor-name" required/></label>
      <div class="admin-two-col"><label>Category<input id="admin-editor-category" required/></label><label>Region<input id="admin-editor-region" required/></label></div>
      <div class="admin-two-col"><label>District<input id="admin-editor-district"/></label><label>Parent destination ID<input id="admin-editor-parent" type="number" min="1"/></label></div>
      <label>Description<textarea id="admin-editor-description" rows="5" required></textarea></label>
      <label>Highlight<input id="admin-editor-highlight"/></label>
      <div class="admin-two-col"><label>Latitude<input id="admin-editor-latitude" type="number" step="0.000001"/></label><label>Longitude<input id="admin-editor-longitude" type="number" step="0.000001"/></label></div>
      <label>Local image path<input id="admin-editor-image" placeholder="images/destinations/..."/></label>
      <label class="admin-check"><input id="admin-editor-active" type="checkbox" checked/> Visible to visitors</label>
      <button class="primary-button" type="submit">Save changes</button>
    </form>
  </dialog>

  <!-- Shared footer + page controller. -->
  <footer id="site-footer"></footer>
  <script type="module" src="../js/pages/admin.js"></script>
</body>
</html>
