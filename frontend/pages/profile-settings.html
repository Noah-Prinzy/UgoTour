<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Private profile-settings metadata/security, PWA links and shared styles. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' http://localhost:* http://127.0.0.1:*; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="theme-color" content="#172114" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../css/main.css?v=9.0.0" />
  <link rel="stylesheet" href="../css/components.css?v=9.0.0" />
  <link rel="stylesheet" href="../css/animations.css?v=9.0.0" />
  <link rel="stylesheet" href="../css/responsive.css?v=9.0.0" />
  <link rel="stylesheet" href="../css/phase1-19.css?v=1.19.0" data-ugotour-phase119="1.19" />
  <title>Edit Profile | UgoTour</title>
</head>
<body class="profile-settings-page">
  <!-- Shared navigation; profile-settings.js validates the current session. -->
  <header id="site-header"></header>

  <main id="main-content" class="profile-settings-main">
    <!-- Page title and navigation back to the main profile view. -->
    <header class="profile-settings-header">
      <div><p class="section-kicker">Profile settings</p><h1>Edit your profile</h1></div>
      <a class="profile-settings-back" href="./profile.html">← Back to profile</a>
    </header>

    <div class="profile-settings-grid">
      <!-- Identity form: updates name, email and editorial bio via PATCH /api/profile. -->
      <section class="profile-settings-card">
        <p class="section-kicker">Identity</p>
        <h2>Name, email &amp; bio</h2>
        <form id="profile-settings-form" class="starter-form profile-form">
          <label>Display name<input id="profile-settings-name" type="text" autocomplete="name" maxlength="120" required /></label>
          <label>Email<input id="profile-settings-email" type="email" autocomplete="email" required /></label>
          <label>Bio<textarea id="profile-settings-bio" maxlength="500" placeholder="Tell travellers a little about yourself…"></textarea></label>
          <button class="primary-button" type="submit">Save profile</button>
          <p id="profile-settings-message" class="form-message" aria-live="polite"></p>
        </form>
      </section>

      <!-- Security form: verifies the current password before replacing it. -->
      <section class="profile-settings-card">
        <p class="section-kicker">Security</p>
        <h2>Change password</h2>
        <form id="profile-settings-password-form" class="starter-form profile-form">
          <label>Current password<input id="profile-settings-current-password" type="password" autocomplete="current-password" required /></label>
          <label>New password<input id="profile-settings-new-password" type="password" minlength="10" autocomplete="new-password" required /></label>
          <label>Confirm new password<input id="profile-settings-confirm-password" type="password" minlength="10" autocomplete="new-password" required /></label>
          <button class="secondary-button" type="submit">Change password</button>
          <p id="profile-settings-password-message" class="form-message" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>

  <!-- Shared footer, password visibility enhancement and settings controller. -->
  <footer id="site-footer"></footer>
  <script src="../js/auth-password-visibility.js"></script>
  <script type="module" src="../js/pages/profile-settings.js?v=1.19.0"></script>
</body>
</html>
