<!DOCTYPE html>
<html lang="en">
<head>
  <!-- New-password page metadata/security and shared styles. -->
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' http://localhost:* http://127.0.0.1:*; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="theme-color" content="#172114"/>
  <meta name="description" content="Choose a new UgoTour password."/>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="manifest" href="../manifest.webmanifest"/>
  <link rel="stylesheet" href="../css/main.css?v=9.0.0"/>
  <link rel="stylesheet" href="../css/components.css?v=9.0.0"/>
  <link rel="stylesheet" href="../css/responsive.css?v=9.0.0"/>
  <title>Reset Password | UgoTour</title>
</head>
<body class="auth-visual-page">
  <main id="main-content" class="auth-entry-main">
    <section class="auth-entry auth-entry-compact">
      <!-- Branded account-security artwork. -->
      <div class="auth-photo-panel">
        <img src="../images/optimized/destinations/lake-bunyonyi/lake-bunyonyi-01.webp" alt="Lake Bunyonyi"/>
        <div class="auth-photo-shade"></div>
        <div class="auth-photo-copy"><p>Secure account</p><h1>Choose a new password.</h1></div>
      </div>

      <!-- reset-password.js reads the token from the URL and submits these matching fields. -->
      <div class="auth-form-panel">
        <a class="auth-brand" href="../index.html">Ugo<span>Tour</span></a>
        <p class="section-kicker">Password reset</p>
        <h2>Set a new password</h2>
        <form id="reset-form" class="starter-form auth-form">
          <label>New password<input id="reset-password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required/></label>
          <label>Confirm password<input id="reset-confirm" type="password" minlength="10" maxlength="128" autocomplete="new-password" required/></label>
          <button class="primary-button" type="submit">Reset password</button>
          <p id="reset-message" class="form-message" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <!-- Reset controller + shared footer bootstrap. -->
  <footer id="site-footer"></footer>
  <script type="module" src="../js/pages/reset-password.js"></script>
  <script type="module" src="../js/footer-boot.js"></script>
</body>
</html>
