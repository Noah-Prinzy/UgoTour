<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#172114" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="Explore Uganda through UgoTour's interactive tourism map." />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="../css/main.css?v=8.11.0" />
  <link rel="stylesheet" href="../css/components.css?v=8.11.0" />
  <link rel="stylesheet" href="../css/animations.css?v=8.11.0" />
  <link rel="stylesheet" href="../css/responsive.css?v=8.11.0" />
  <link rel="stylesheet" href="../css/map.css?v=8.11.0" />
  <title>Map | UgoTour</title>
</head>
<body class="map-page">
  <header id="site-header"></header>

  <main class="map-main">
    <section class="map-stage" aria-label="Interactive map of Uganda tourism locations">
      <div id="uganda-map" class="uganda-map" role="region" aria-label="Uganda tourism map"></div>

      <div class="map-search-dock">
        <label class="map-search" for="map-search-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-4-4" />
          </svg>
          <input id="map-search-input" type="search" placeholder="Search a destination or attraction…" autocomplete="off" />
          <button id="map-search-clear" type="button" aria-label="Clear map search" hidden>×</button>
        </label>
        <div id="map-search-suggestions" class="map-search-suggestions" hidden aria-label="Search suggestions"></div>
      </div>

      <button id="map-fit-uganda" class="map-fit-button" type="button" title="Fit Uganda in view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
        </svg>
        <span>Fit Uganda</span>
      </button>

      <div class="map-pin-key" aria-label="Map pin legend">
        <span><i class="pin-key-dot is-destination"></i>Destination</span>
        <span><i class="pin-key-dot is-attraction"></i>Attraction</span>
      </div>

      <p id="map-loading-state" class="map-loading-state">Loading Uganda tourism map…</p>
      <div id="map-offline-state" class="map-offline-state" hidden>
        <strong>The interactive map needs a connection.</strong>
        <p>Reconnect to load the live map tiles. Your tourism library is still safe in UgoTour.</p>
        <button id="map-retry-button" class="secondary-button" type="button">Retry map</button>
      </div>

      <div id="map-search-empty" class="map-search-empty" hidden aria-live="polite">No matching place found.</div>

      <svg id="map-callout-connector" class="map-callout-connector" aria-hidden="true">
        <path id="map-callout-line" d="" />
        <circle id="map-callout-end" r="4" cx="0" cy="0" />
      </svg>

      <article id="map-place-callout" class="map-place-callout" hidden aria-live="polite">
        <button id="map-place-panel-close" class="map-panel-close" type="button" aria-label="Close place information">×</button>
        <img id="map-place-image" src="" alt="" />
        <div class="map-place-copy">
          <div class="map-place-meta">
            <span id="map-place-type"></span>
            <span id="map-place-category"></span>
          </div>
          <h2 id="map-place-name"></h2>
          <p id="map-place-location" class="map-place-location"></p>
          <p id="map-place-description"></p>
          <a id="map-place-details" class="map-details-link" href="#">View details <span aria-hidden="true">→</span></a>
        </div>
      </article>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="../js/pages/map.js"></script>
</body>
</html>
