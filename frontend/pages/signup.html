<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up | UgoTour</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css"></head>
<body class="bg-stone-50 text-slate-900"><header id="site-header"></header><main class="section-shell page-shell"><p class="section-kicker">Create account</p><h1 class="page-title">Sign up</h1><form id="signup-form" class="starter-form"><label>Name<input id="signup-name" type="text" required></label><label>Email<input id="signup-email" type="email" required></label><label>Password<input id="signup-password" type="password" minlength="6" required></label><button class="primary-button" type="submit">Create account</button><p id="signup-message" class="form-message"></p></form></main><footer id="site-footer"></footer><script type="module" src="../js/pages/signup.js"></script></body></html>
