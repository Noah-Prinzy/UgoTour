<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#172114" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="Create your UgoTour account." />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../css/main.css?v=8.7.3" />
  <link rel="stylesheet" href="../css/components.css?v=8.7.3" />
  <link rel="stylesheet" href="../css/animations.css?v=8.7.3" />
  <link rel="stylesheet" href="../css/responsive.css?v=8.7.3" />
  <title>Sign Up | UgoTour</title>
</head>
<body class="auth-visual-page signup-page">
  <header id="site-header"></header>
  <main class="auth-entry-main">
    <section class="auth-entry" aria-labelledby="signup-title">
      <div class="auth-photo-panel">
        <img src="../images/destinations/sipi-falls/sipi-falls-01.jpg" alt="Sipi Falls landscape" />
        <div class="auth-photo-shade" aria-hidden="true"></div>
        <div class="auth-photo-copy"><p>Travel deeper</p><h1>Create your Uganda story.</h1><span>Sipi Falls · Eastern Uganda</span></div>
      </div>
      <div class="auth-form-panel">
        <a class="auth-brand" href="../index.html">Ugo<span>Tour</span></a>
        <p class="section-kicker">Create account</p>
        <h2 id="signup-title">Join UgoTour</h2>
        <p class="auth-form-copy">Create one secure travel identity for your profile and bookings.</p>
        <form id="signup-form" class="starter-form auth-form">
          <label>Full name<input id="signup-name" type="text" autocomplete="name" required /></label>
          <label>Email<input id="signup-email" type="email" autocomplete="email" required /></label>
          <label>Password<input id="signup-password" type="password" minlength="8" autocomplete="new-password" required /></label>
          <label>Confirm password<input id="signup-confirm-password" type="password" minlength="8" autocomplete="new-password" required /></label>
          <button class="primary-button auth-submit-button" type="submit">Create account</button>
          <p id="signup-message" class="form-message" aria-live="polite"></p>
        </form>
        <p class="auth-switch-copy">Already have an account? <a href="./login.html">Login here</a>.</p>
      </div>
    </section>
  </main>
  <footer id="site-footer" hidden></footer>
  <script type="module" src="../js/pages/signup.js"></script>
</body>
</html>
