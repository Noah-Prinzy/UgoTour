<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="UgoTour — explore Uganda through destinations, culture and experiences." />
  <title>UgoTour | Explore Uganda</title>

  <!-- Tailwind is used only as a UI/design helper. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Our own CSS remains available for custom design and animations. -->
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/animations.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body class="bg-stone-50 text-slate-900">
  <header id="site-header"></header>

  <main>
    <section class="hero-shell">
      <div class="hero-content">
        <p class="hero-kicker">Discover the Pearl of Africa</p>
        <h1>Explore Uganda with UgoTour.</h1>
        <p class="hero-copy">
          Find destinations, experiences, culture and travel ideas in one simple tourism platform.
        </p>

        <div class="hero-actions">
          <button id="explore-button" class="primary-button">Explore destinations</button>
          <button id="about-button" class="secondary-button">How UgoTour works</button>
        </div>

        <!-- Phase 1: JavaScript-powered destination search. -->
        <div class="hero-search">
          <label for="destination-search">Search destinations</label>

          <div class="search-box">
            <input
              type="text"
              id="destination-search"
              placeholder="Try Jinja, Bwindi or Murchison Falls..."
              autocomplete="off"
            />

            <button id="search-button" type="button">Search</button>
          </div>

          <p id="search-message" aria-live="polite"></p>
        </div>
      </div>

      <div class="hero-panel" aria-label="Featured destination placeholder">
        <span class="hero-panel-label">Featured</span>
        <h2>Murchison Falls</h2>
        <p>Our first sample destination. We will replace this with real API data later.</p>
      </div>
    </section>

    <section class="section-shell">
      <div class="section-heading">
        <p class="section-kicker">Starter content</p>
        <h2>Popular experiences</h2>
      </div>

      <!-- JavaScript dynamically places destination cards in this grid. -->
      <div id="experience-grid" class="experience-grid"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <!-- All interactive behavior is handled by our own JavaScript modules. -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
